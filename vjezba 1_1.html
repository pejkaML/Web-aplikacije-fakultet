    <h1>Zagreb</h1>
    <h2>Ime</h2>
    <p>O postanku imena grada Zagreba postoje različite teorije. Po jednima se izvodi od glagola zagrepsti, odnosno, ukopati.</p>
    <p>Po drugima se dovodi u svezu sa starim hrvatskim imenom za obalu „b(e)reg“ koju i danas koriste u krašićkom kraju gdje Zagreb nazivaju Zabreg.</p>
